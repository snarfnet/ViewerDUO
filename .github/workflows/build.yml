name: Build and Upload to App Store

on:
  push:
    branches: [master, 'dev/**']
  workflow_dispatch:

env:
  # Upload and review submission happen only from master; dev branches stop after screenshots.
  ASC_READY: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}

jobs:
  build:
    # iOS 27.1 SDK is required for the app to fill the iPhone Duo screens.
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: |
        if [ -d /Applications/Xcode_27.1.app ]; then
          sudo xcode-select -s /Applications/Xcode_27.1.app
        else
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_27\.[0-9.]*app$" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
        fi
        xcodebuild -version
        xcodebuild -showsdks | grep -i iphoneos

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set build number
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + 10 ))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: [0-9]*/CURRENT_PROJECT_VERSION: $BUILD_NUM/" project.yml
        echo "Build number: $BUILD_NUM"

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project ViewerDUO.xcodeproj -scheme ViewerDUO

    - name: Build for Simulator (compile check + screenshots)
      run: |
        set -e
        IPHONE=$(xcrun simctl list devices available | grep -oE "iPhone 16 Pro Max" | head -1)
        [ -z "$IPHONE" ] && IPHONE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | tail -1)
        echo "IPHONE=$IPHONE" >> $GITHUB_ENV
        mkdir -p build
        xcodebuild build -scheme ViewerDUO -configuration Release \
          -destination "platform=iOS Simulator,name=$IPHONE" \
          -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/sim_build.log | grep -E "error:|warning: unre|BUILD" || true
        grep -q "BUILD SUCCEEDED" build/sim_build.log

    - name: Capture Screenshots
      run: |
        set -e
        IPHONE="$IPHONE"
        APP=$(find build/sim/Build/Products -maxdepth 3 -name "*.app" | head -1)
        xcrun simctl boot "$IPHONE" || true
        xcrun simctl bootstatus "$IPHONE"
        xcrun simctl install "$IPHONE" "$APP"
        mkdir -p shots/iphone
        for shot in library reader slide; do
          xcrun simctl terminate "$IPHONE" com.tokyonasu.ViewerDUO || true
          xcrun simctl launch "$IPHONE" com.tokyonasu.ViewerDUO -AppleLanguages "(ja)" -AppleLocale ja_JP -screenshot $shot || true
          sleep 10
          xcrun simctl io "$IPHONE" screenshot shots/iphone/$shot.png
        done
        IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro 13-inch \(M[0-9]+\)" | head -1)
        [ -z "$IPAD" ] && IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro[^(]*\(M[0-9]+\)" | head -1)
        echo "iPad: $IPAD"
        xcodebuild build -scheme ViewerDUO -configuration Release \
          -destination "platform=iOS Simulator,name=$IPAD" \
          -derivedDataPath build/simpad CODE_SIGNING_ALLOWED=NO | tail -3
        APPPAD=$(find build/simpad/Build/Products -maxdepth 3 -name "*.app" | head -1)
        xcrun simctl boot "$IPAD" || true
        xcrun simctl bootstatus "$IPAD"
        xcrun simctl install "$IPAD" "$APPPAD"
        mkdir -p shots/ipad
        for shot in library reader slide; do
          xcrun simctl terminate "$IPAD" com.tokyonasu.ViewerDUO || true
          xcrun simctl launch "$IPAD" com.tokyonasu.ViewerDUO -AppleLanguages "(ja)" -AppleLocale ja_JP -screenshot $shot || true
          sleep 10
          xcrun simctl io "$IPAD" screenshot shots/ipad/$shot.png
        done
        ls -la shots/iphone shots/ipad

    - name: Capture iPhone Duo screenshots (check only, not uploaded)
      continue-on-error: true
      run: |
        DUO=$(xcrun simctl list devices available | grep -oE "iPhone Duo" | head -1)
        [ -z "$DUO" ] && { echo "no iPhone Duo simulator"; exit 0; }
        APP=$(find build/sim/Build/Products -maxdepth 3 -name "*.app" | head -1)
        xcrun simctl boot "$DUO" || true
        xcrun simctl bootstatus "$DUO"
        xcrun simctl install "$DUO" "$APP"
        mkdir -p duo
        for shot in library reader slide; do
          xcrun simctl terminate "$DUO" com.tokyonasu.ViewerDUO || true
          xcrun simctl launch "$DUO" com.tokyonasu.ViewerDUO -AppleLanguages "(ja)" -AppleLocale ja_JP -screenshot $shot || true
          sleep 10
          xcrun simctl io "$DUO" screenshot duo/$shot.png
        done
        ls -la duo

    - name: Upload screenshots artifact
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: |
          shots
          duo

    - name: Set up ASC API Key
      if: env.ASC_READY == 'true'
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Build Archive
      run: |
        xcodebuild archive \
          -scheme ViewerDUO \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/ViewerDUO.xcarchive \
          CURRENT_PROJECT_VERSION=${BUILD_NUM} \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec
      if: env.ASC_READY == 'true'

    - name: Export IPA
      if: env.ASC_READY == 'true'
      run: |
        xcodebuild -exportArchive \
          -archivePath build/ViewerDUO.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export_options.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Install PyJWT
      if: env.ASC_READY == 'true'
      run: pip3 install --break-system-packages PyJWT requests Pillow

    - name: Prepare App Store version
      if: env.ASC_READY == 'true'
      run: python3 scripts/prepare_version.py

    - name: Upload Screenshots
      if: env.ASC_READY == 'true'
      run: python3 scripts/upload_screenshots.py

    - name: Submit for Review
      if: env.ASC_READY == 'true'
      run: python3 scripts/submit.py ${{ env.BUILD_NUM }}
