name: Verify Viewer DUO
on:
  workflow_dispatch:
  push:
    branches: ['improve/**']
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild build -project ViewerDUO.xcodeproj -scheme ViewerDUO -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
