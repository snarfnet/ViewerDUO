name: Verify Viewer DUO
on:
  workflow_dispatch:
  push:
    branches: ['improve/**']
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kind: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - run: swiftc ViewerDUO/Models/Book.swift Tests/main.swift -o /tmp/viewerduo-model-test && /tmp/viewerduo-model-test
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild build -project ViewerDUO.xcodeproj -scheme ViewerDUO -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Capture comparison
        timeout-minutes: 12
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p shots
            DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; kind=sys.argv[1]; devices=[d for ds in json.load(sys.stdin)["devices"].values() for d in ds if d.get("isAvailable")]; matches=[d for d in devices if ((d["name"].startswith("iPhone") and "Duo" not in d["name"]) if kind=="iphone" else d["name"].startswith("iPad Pro 13"))]; print(matches[-1]["udid"])' "$KIND")
            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/ViewerDUO.app
            xcrun simctl launch "$DEVICE" com.tokyonasu.ViewerDUO -AppleLanguages '(ja)' -AppleLocale ja_JP -screenshot comparison
            sleep 25
            xcrun simctl io "$DEVICE" screenshot "shots/$KIND.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-${{ matrix.kind }}
          path: shots
