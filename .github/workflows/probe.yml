name: Probe SDK
on:
  push:
    branches: [dev/v1.2]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: xcode-27
    steps:
    - run: |
        sudo xcode-select -s /Applications/Xcode_27.1.app
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK=$SDK"
        U="$SDK/System/Library/Frameworks/UIKit.framework"
        grep -v "^//" "$U/Headers/UIViewReservedRegion.h" | grep -v "^\s*$" | head -80
        grep -v "^\s*$" "$U/Headers/UIHingeInteraction.h" | grep -vE "^\s*///" | head -60
        I=$(find "$U" -name "arm64e-apple-ios.swiftinterface" | head -1)
        sed -n '1965,2060p' "$I"
