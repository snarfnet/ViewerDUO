name: Probe SDK
on:
  push:
    branches: [dev/v1.2]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: xcode-27
    steps:
    - run: |
        sudo xcode-select -s /Applications/Xcode_27.1.app
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK=$SDK"
        for f in $(find "$SDK/System/Library/Frameworks/UIKit.framework" "$SDK/System/Library/Frameworks/SwiftUI.framework" "$SDK/System/Library/Frameworks/SwiftUICore.framework" -name "*.swiftinterface" -path "*arm64e*" 2>/dev/null) $(find "$SDK/System/Library/Frameworks/UIKit.framework" -name "*.h"); do
          grep -nHiE "reservedRegion|ReservedRegion|hinge|HingeInteraction|division|occlusion" "$f" | grep -v "^\s*//" | head -80
        done | cut -c1-400 | head -300
