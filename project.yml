name: ViewerDUO
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.ViewerDUO
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
    MTL_FAST_MATH: YES
packages:
  Unrar:
    url: https://github.com/mtgto/Unrar.swift
    from: 0.5.4
targets:
  ViewerDUO:
    type: application
    platform: iOS
    sources: [ViewerDUO]
    dependencies:
      - package: Unrar
    settings:
      base:
        INFOPLIST_FILE: ViewerDUO/Info.plist
        PRODUCT_NAME: ViewerDUO
